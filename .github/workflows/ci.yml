name: K-Valkyrie CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Daemon & GNN Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Daemon Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daemon/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v --cov=daemon

  ebpf-verification:
    name: eBPF Probes Compilation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LLVM & eBPF Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev

      - name: Compile eBPF Bytecode
        run: |
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -I ebpf_probes/headers -c ebpf_probes/syscall_tracer.bpf.c -o /tmp/syscall_tracer.o
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -I ebpf_probes/headers -c ebpf_probes/lsm_enforcer.bpf.c -o /tmp/lsm_enforcer.o
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -I ebpf_probes/headers -c ebpf_probes/xdp_net_guard.bpf.c -o /tmp/xdp_net_guard.o
          echo "[+] All eBPF probes successfully verified with Clang BPF target."

  dashboard-build:
    name: React Dashboard Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install & Build Dashboard
        working-directory: dashboard
        run: |
          npm ci || npm install
          npm run build
