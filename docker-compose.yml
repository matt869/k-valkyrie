version: '3.8'

services:
  k-valkyrie-daemon:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get install -y \
            clang llvm libelf-dev libbpf-dev linux-tools-common \
            build-essential python3 python3-pip python3-dev git \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY daemon/requirements.txt ./daemon/requirements.txt
        RUN pip3 install --no-cache-dir -r daemon/requirements.txt
        CMD ["python3", "daemon/main.py"]
    container_name: k-valkyrie-engine
    privileged: true
    pid: "host"
    network_mode: "host"
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - BPF
      - PERFMON
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
